<div class="sub-agency-modal field">
  <ng-container *ngIf="timer > 0; else timeOutElse">
    <div class="alert-box" >
      <div class="modal-header sticky-modal-header bg-default">
        <h5 class="modal-title">{{SessionTimeoutLabelsConstants.sessionTimeout}}</h5>
        <button type="button" class="close" aria-label="Close" (click)="closeDialog()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p class="text-center">{{SessionTimeoutLabelsConstants.topLabel}}</p>
         <h2 class="text-center timer-text text-bold"><span id="time" >{{removeMinSec(display)}}</span></h2>
         <p class="text-center">{{SessionTimeoutLabelsConstants.bottomLabel}}</p>
      </div>
      <div class="modal-footer sticky-modal-footer text-center">
        <button type="button" class="btn btn-info text-light btn-md" (click)="closeDialog()">{{SessionTimeoutLabelsConstants.buttonContinueLabel}}</button>
      </div>
    </div>
  </ng-container>
  <ng-template #timeOutElse>
    <div class="alert-box" >
      <div class="modal-header sticky-modal-header bg-default">
        <h5 class="modal-title">{{SessionTimeoutLabelsConstants.sessionTimeout}}</h5>
        <button type="button" class="close" aria-label="Close" (click)="closeTimoutDialog()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p class="text-center"></p>
         <p class="text-center"><span >{{SessionTimeoutLabelsConstants.logoutMsg}}</span></p>
         <p class="text-center"></p>
      </div>
      <div class="modal-footer sticky-modal-footer text-center">
        <button type="button" class="btn btn-primary text-light btn-md" (click)="closeTimoutDialog()">{{SessionTimeoutLabelsConstants.buttonOkLabel}}</button>
      </div>
    </div>
  </ng-template>

  </div>
