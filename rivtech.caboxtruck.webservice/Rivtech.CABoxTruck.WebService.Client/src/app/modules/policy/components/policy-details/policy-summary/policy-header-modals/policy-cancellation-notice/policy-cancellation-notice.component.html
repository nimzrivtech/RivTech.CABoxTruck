<div role="document">
    <div class="modal-content">
        <div class="modal-header sticky-modal-header">
            <h5 class="modal-title">{{title}}</h5>
            <button type="button" class="close" (click)="onClose()" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div [formGroup]="fg" class="modal-body">
            <div class="col">
                <div class="form-group field">
                    <label for="" class="required">Notice Date</label>
                    <app-date-picker 
                        [options]="this.policyCancellationNoticeData.cancellationNoticeDateOptions"
                        formControlName="noticeDate"
                        [isInvalid]="fg.get('noticeDate').errors?.required"
                        [customRequiredErrorMessage]="'Notice Date is required'"
                        (dateChange)="this.policyCancellationNoticeData.onChangeNoticeDate($event)"
                    ></app-date-picker>
                </div>

                <div class="form-group field">
                    <label for="" class="required">Effective Date</label>
                    <app-date-picker 
                        [options]="this.policyCancellationNoticeData.cancellationEffectiveDateOptions"
                        formControlName="effectiveDate"
                        [isInvalid]="fg.get('effectiveDate').errors?.required"
                        [customRequiredErrorMessage]="'Effective Date is required'"
                    ></app-date-picker>
                </div>
    
                <div class="form-group field">
                    <label for="" class="required">Cancellation Reason</label>
                    <select class="form-control" formControlName="cancellationReasonType">
                        <option [value]="''" selected>Please Select</option>
                        <option *ngFor="let reason of this.policyCancellationNoticeData.cancellationNoticeReasons | orderBy: 'description'" [value]="reason.id">{{reason.description}}</option>
                    </select>
                    <app-validation-error [control]="fc.cancellationReasonType" [inputName]="'Cancellation Reason'"></app-validation-error>
                </div>
            </div>
        </div>
      
        <div class="modal-footer sticky-modal-footer text-right ">
            <button type="submit" class="btn btn-primary" data-dismiss="modal" (click)='onSubmit()' [disabled]="!this.fg.valid">Submit</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal" (click)='onClose()'>Close</button>
        </div>
    </div>
  </div>
