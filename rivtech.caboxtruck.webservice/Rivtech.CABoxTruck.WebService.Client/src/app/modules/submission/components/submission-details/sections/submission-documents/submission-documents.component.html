<div class="page-position">
    <div class="card sticky-body">
        <div class="card-header">
            <i class="icons header-icon" [ngClass]="hideMe ? 'icon-arrow-down': 'icon-arrow-up'" data-toggle="collapse"
                href="#notesCard" (click)="ToggleHiding()"></i>
            <strong>Documents</strong>
        </div>
        <div class="card-body standard-padding collapse show" id="notesCard" style="padding-top: 1.5%">
            <div class="col">
                <div class="row pb-2">
                    <div class="col-9">
                        <label style="margin-bottom: -20px; padding-top: 1rem;">
                            <h4>Documents</h4>
                        </label>
                    </div>
                    <div class="col-3">
                        <div class="input-group" style="padding-top: 1rem;">
                          <input type="text" id="policDocsSearch" #policydocuments class="form-control" placeholder="Search" #Search
                          title="Search Documents" (keydown.enter)="searchDocuments(policydocuments.value)">
                          <div class="input-group-append">
                          <button class="btn btn-secondary search-button" type="button" (click)="searchDocuments(policydocuments.value)">
                              <i class="fa fa-search customized-blue"></i>
                          </button>
                          </div>
                        </div>
                      </div>
                </div>
                <app-documents-list [disableItems]="disableItems"></app-documents-list>
            </div>
        </div>
    </div>
    <app-next-back-button [isScrollPage]="true" (clickType)="onClick($event)" [hideQuote]="true">
    </app-next-back-button>
</div>
