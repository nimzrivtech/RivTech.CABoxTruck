<div class="modal-header sticky-modal-header">
  <h5 class="modal-title">{{modalTitle}}</h5>
  <button type="button" class="close" aria-label="Close" (click)="this.onCancel()">
      <span aria-hidden="true">&times;</span>
  </button>
</div>

<div class="modal-body modalUpload" [formGroup]="this.fg">

  <div class="form-group field col-md-12">
    <label class="required" for="relevantDocumentDesc">Description</label>
    <div class="">
        <textarea id='description' rows="2" cols="1" class="field-text-area-border" formControlName="description" maxlength="100"></textarea>
        <app-validation-error [control]="this.fc.description" [inputName]="'Description'"></app-validation-error>
    </div>
  </div>

    <div class="form-group field col-md-12">
      <label for="createdDate">Date Added</label>
      <div class=" ">
        <app-date-picker formControlName="createdDate" id="createdDate" [options]="{
          dateFormat: 'mm/dd/yyyy'
        }"
        [isDisabled]="true"
        ></app-date-picker>
        <app-validation-error [control]="this.fc.createdDate" [inputName]="'Date Added'"></app-validation-error>
      </div>
    </div>

    <div class="form-group field col-md-12">
      <label class="note" for='isPreBind'>Maximum upload file size: 22MB</label>
    </div>

    <div class="form-group field col-md-12">
      <div class="input-group mb-3"
        (dragover)="onDragOver($event)" 
        (drop)="onDrop($event)"
        (dragleave)="onDragLeave($event)"
        [class.drag-over-border]="dragOver">
        <label for="fileInput" class="btnUpload text-nowrap mr-2 pointer" 
          (mouseenter)="onDragOver($event)" (mouseleave)="onDragLeave($event)">
            Drag & Drop files or Click here
        </label>
        <input type="file" id="fileInput" (change)="onFileSelected($event)" multiple style="display:none;" [accept]="acceptedFileTypes">
        <span *ngIf="selectedFiles.length > 0; else oldTemplateFileCount" >{{selectedFiles.length}} File(s) Chosen</span>
        <ng-template #oldTemplateFileCount> <span>{{filesSelected}}</span></ng-template>
      </div>

    
      <div class="ellipse">
        <div *ngIf="Data.getFileName !== ''">Upload the following:</div>
        <span [attr.title]="Data.getFileName">{{Data.getFileName}}</span>
        <div class="invalid-feedback" *ngIf="isInvalidFilename" >Filename exceeds max length of 500 characters.</div>
      </div>
      <input type="file" #fileSelection placeholder="Choose File" class="d-none" [accept]="acceptedFileTypes" multiple
        (change)="fileChange(fileSelection.files)">
    
      <div *ngIf="fc.fileValidation.errors?.invalidFileType" class="invalid-feedback">
        {{ invalidFileTypeErrorMessage }}
      </div>
      <div class="mt-3" *ngIf="fc.fileValidation.errors?.invalidFileSize">
        <div style="font-size:80%;">{{ invalidSizeNames }}</div>
        <span class=invalid-feedback>{{ invalidFileSizeErrorMessage }}</span>
      </div>
    </div>
</div>

<div class="modal-footer sticky-modal-footer">
  <button type="button" class="btn btn-primary" (click)="this.SubmitAttachment(this.fileSelection.files)" [disabled]="this.fg.invalid || isInvalidFilename || this.fc.invalid">{{modalButton}}</button>
  <button type="button" class="btn btn-danger" (click)="this.onCancel()">Cancel</button>
</div>
